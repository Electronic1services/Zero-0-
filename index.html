<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>خريطة العدادات الصفرية</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-950:#0a2e2e;
    --teal-900:#0f3d3d;
    --teal-700:#155e5e;
    --teal-500:#1d8a8a;
    --amber-500:#d97b1f;
    --amber-100:#fce9d2;
    --sand-50:#f6f4ef;
    --ink:#1c2624;
    --line:#e2e0d8;
    --on-color:#1d8a4a;
    --off-color:#c23b3b;
    --shadow: 0 8px 28px rgba(10,46,46,.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:'Tajawal',sans-serif;
    background:var(--sand-50);
    color:var(--ink);
    overscroll-behavior:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }

  /* ---- Top bar ---- */
  #topbar{
    background:var(--teal-950);
    color:#fff;
    padding:10px 12px;
    display:flex; flex-direction:column; gap:8px;
    z-index:1200;
    box-shadow:var(--shadow);
  }
  #topbar .row1{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  #topbar h1{
    font-size:16px; font-weight:900; margin:0;
    display:flex; align-items:center; gap:6px;
  }
  #topbar h1 .count{
    font-weight:500; font-size:12px; color:#bfe3e3;
  }
  #empName{
    background:var(--teal-900);
    border:1px solid var(--teal-700);
    color:#fff;
    border-radius:10px;
    padding:8px 10px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    width:130px;
    text-align:right;
  }
  #empName::placeholder{color:#8fbcbc;}
  #searchRow{
    display:flex; gap:8px;
  }
  #searchBox{
    flex:1;
    padding:10px 12px;
    border-radius:12px;
    border:none;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  #searchBox:focus{outline:2px solid var(--amber-500);}
  #filterBtn{
    background:var(--teal-700);
    border:1px solid var(--teal-500);
    color:#fff;
    border-radius:12px;
    padding:0 14px;
    font-size:13px;
    font-family:'Tajawal',sans-serif;
    white-space:nowrap;
  }
  #filterBtn.active{background:var(--amber-500); border-color:var(--amber-500);}

  #searchResults{
    position:absolute; top:96px; right:12px; left:12px;
    background:#fff; border-radius:12px; box-shadow:var(--shadow);
    max-height:45vh; overflow:auto; z-index:1300; display:none;
  }
  #searchResults .item{
    padding:10px 12px; border-bottom:1px solid var(--line);
    font-size:13px; cursor:pointer;
  }
  #searchResults .item:active{background:var(--amber-100);}
  #searchResults .item b{color:var(--teal-900);}
  #searchResults .item .sub{color:#767; color:#6b7370; font-size:12px; margin-top:2px;}
  #searchResults .empty{padding:14px; text-align:center; color:#888; font-size:13px;}

  /* ---- Map ---- */
  #map{width:100%; height:100%; min-height:0; flex:0 0 100%; position:relative;}
  .leaflet-control-attribution{font-size:9px;}

  /* Safety-net Leaflet core styles: if the external leaflet.css is slow to load or briefly
     blocked on some networks, these essential rules keep the map itself sized, clipped, and
     interactive (tiles positioned correctly, controls tappable) until the full stylesheet arrives. */
  .leaflet-container{ position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; background:#ddd; outline:0; touch-action:pan-x pan-y; }
  .leaflet-container a{ color:#0078A8; }
  .leaflet-pane{ z-index:400; }
  .leaflet-tile-pane{ z-index:200; }
  .leaflet-overlay-pane{ z-index:400; }
  .leaflet-marker-pane{ z-index:600; }
  .leaflet-popup-pane{ z-index:700; }
  .leaflet-map-pane canvas{ z-index:100; }
  .leaflet-map-pane svg{ z-index:200; }
  .leaflet-tile-pane, .leaflet-map-pane, .leaflet-marker-pane, .leaflet-overlay-pane, .leaflet-popup-pane, .leaflet-shadow-pane{ position:absolute; left:0; top:0; }
  .leaflet-tile{ position:absolute; width:256px; height:256px; user-select:none; -webkit-user-drag:none; }
  .leaflet-control-container .leaflet-top, .leaflet-control-container .leaflet-bottom{ position:absolute; z-index:1000; pointer-events:none; }
  .leaflet-top{ top:0; } .leaflet-right{ right:0; } .leaflet-bottom{ bottom:0; } .leaflet-left{ left:0; }
  .leaflet-control{ pointer-events:auto; float:left; clear:both; margin:10px; }
  .leaflet-bar{ background:#fff; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.4); }
  .leaflet-bar a{ display:block; width:30px; height:30px; line-height:30px; text-align:center; text-decoration:none; color:#333; font-size:18px; }
  .leaflet-marker-icon, .leaflet-marker-shadow{ position:absolute; }

  .meter-pin{
    width:26px; height:26px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    border:2px solid #fff;
    display:flex; align-items:center; justify-content:center;
  }
  .meter-pin.on{background:var(--on-color);}
  .meter-pin.off{background:var(--off-color);}
  .meter-pin .dot{
    width:8px; height:8px; border-radius:50%;
    background:#fff; transform:rotate(45deg);
  }
  .meter-pin .visited-check{
    position:absolute; top:-7px; right:-7px;
    width:15px; height:15px; border-radius:50%;
    background:#fff; color:#0f7a43; border:2px solid #0f7a43;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:900; line-height:1;
    transform:rotate(45deg); box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  /* ---- Legend ---- */
  #legend{
    position:absolute; bottom:16px; left:10px; z-index:900;
    background:rgba(255,255,255,.95); border-radius:10px;
    padding:8px 10px; font-size:12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:4px;
  }
  #legend .l{display:flex; align-items:center; gap:6px;}
  #legend .sw{width:10px; height:10px; border-radius:50%;}

  #locateBtn{
    position:absolute; bottom:16px; right:10px; z-index:900;
    width:44px; height:44px; border-radius:50%;
    background:#fff; box-shadow:var(--shadow); border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  #locateBtn.tracking{ background:#1d6fd9; color:#fff; }

  #clearTrailBtn{
    position:absolute; bottom:16px; right:64px; z-index:900;
    height:44px; border-radius:22px; padding:0 14px;
    background:#fff; box-shadow:var(--shadow); border:none;
    display:none; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; white-space:nowrap;
  }
  #clearTrailBtn.show{ display:flex; }

  /* Live GPS position: pulsing blue dot with heading cone, similar to Google Maps */
  .live-dot-wrap{ position:relative; width:26px; height:26px; }
  .live-dot-pulse{
    position:absolute; top:50%; left:50%; width:26px; height:26px;
    margin:-13px 0 0 -13px; border-radius:50%;
    background:rgba(29,111,217,.35);
    animation:liveDotPulse 1.8s ease-out infinite;
  }
  @keyframes liveDotPulse{
    0%{ transform:scale(0.4); opacity:.9; }
    100%{ transform:scale(2.2); opacity:0; }
  }
  .live-dot-core{
    position:absolute; top:50%; left:50%; width:16px; height:16px;
    margin:-8px 0 0 -8px; border-radius:50%;
    background:#1d6fd9; border:3px solid #fff;
    box-shadow:0 1px 5px #0007;
  }

  /* Custom zoom buttons: styled entirely with our own CSS (not dependent on
     leaflet.css loading), so they are guaranteed to show up and be tappable
     regardless of any external stylesheet delay or block. */
  #zoomControls{
    position:absolute; bottom:70px; right:10px; z-index:900;
    display:flex; flex-direction:column; box-shadow:var(--shadow);
    border-radius:12px; overflow:hidden;
  }
  #zoomControls button{
    width:44px; height:44px; background:#fff; border:none;
    font-size:22px; font-weight:700; color:var(--teal-950);
    display:flex; align-items:center; justify-content:center;
  }
  #zoomControls button:first-child{ border-bottom:1px solid var(--line); }
  #zoomControls button:active{ background:var(--sand-50); }

  /* ---- Bottom sheet ---- */
  #overlay{
    position:fixed; inset:0; background:rgba(10,20,20,.45);
    z-index:1400; display:none;
  }
  #sheet{
    position:fixed;
    right:10px;
    left:10px;
    bottom:10px;
    z-index:1500;
    background:#fff;
    border-radius:18px;
    box-shadow:0 -8px 30px rgba(0,0,0,.28);
    max-height:56vh;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    transform:translateY(calc(100% + 20px));
    transition:transform .25s ease;
    padding-bottom:8px;
  }
  #sheet.open{transform:translateY(0);}
  #sheetHandle{
    position:sticky;
    top:0;
    z-index:4;
    display:flex;
    justify-content:center;
    padding:5px 0 2px;
    background:#fff;
    border-radius:18px 18px 0 0;
  }
  #sheetHandle span{width:34px; height:3px; border-radius:3px; background:var(--line);}

  #sheetHeader{
    padding:0 44px 5px 10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:5px;
  }
  #sheetHeader .status-badge{
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px;
    color:#fff; white-space:nowrap;
  }
  .status-badge.on{background:var(--on-color);}
  .status-badge.off{background:var(--off-color);}
  #sheetHeader h2{margin:0 0 1px; font-size:13px; color:var(--teal-950);}
  #sheetHeader .meterid{font-size:10px; color:#666;}

  .infoGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    padding:5px 10px;
    border-bottom:1px solid var(--line);
  }
  .infoGrid .cell{
    background:var(--sand-50); border-radius:8px; padding:4px 6px;
  }
  .infoGrid .cell .label{font-size:9px; color:#8a8f8c;}
  .infoGrid .cell .val{font-size:11px; font-weight:700; color:var(--ink); margin-top:0;}

  #gmapBtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:6px 10px 3px;
    background:var(--teal-950); color:#fff; text-decoration:none;
    padding:7px; border-radius:9px; font-weight:700; font-size:11px;
  }
  #gmapBtn:active{background:var(--teal-700);}

  #sheetBody{padding:6px 10px 8px;}
  #sheetBody h3{font-size:11px; margin:0 0 4px; color:var(--teal-900);}

  #noteText{
    width:100%; min-height:42px; max-height:68px; border-radius:8px;
    border:1.5px solid var(--line); padding:6px 8px;
    font-family:'Tajawal',sans-serif; font-size:11px; resize:vertical;
  }
  #noteText:focus{outline:none; border-color:var(--amber-500);}

  #photoRow{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .photoLabel{
    display:flex; align-items:center; gap:6px;
    background:var(--sand-50); border:1.5px dashed var(--line);
    border-radius:8px; padding:6px 9px; font-size:10px; cursor:pointer;
    color:var(--teal-900);
  }
  #photoPreviewWrap{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
  #photoPreviewWrap img{width:46px; height:46px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
  .photoDel{
    position:relative;
  }
  .photoDel .x{
    position:absolute; top:-6px; left:-6px; background:var(--off-color); color:#fff;
    width:20px; height:20px; border-radius:50%; font-size:12px; display:flex; align-items:center; justify-content:center;
  }

  #saveBtn{
    width:100%; margin-top:6px; padding:7px; border:none; border-radius:9px;
    background:var(--amber-500); color:#fff; font-weight:900; font-size:11px;
    font-family:'Tajawal',sans-serif;
  }
  #saveBtn:active{background:#b5670f;}
  #saveMsg{
    text-align:center; font-size:12px; color:var(--on-color); margin-top:6px; min-height:14px;
  }

  #notesLog{margin-top:8px;}
  .noteEntry{
    background:var(--sand-50); border-radius:9px; padding:7px 8px; margin-bottom:5px;
    border-right:3px solid var(--teal-500);
  }
  .noteEntry .meta{display:flex; justify-content:space-between; font-size:9px; color:#828a86; margin-bottom:2px;}
  .noteEntry .meta b{color:var(--teal-900);}
  .noteEntry .txt{font-size:11px; line-height:1.4;}
  .noteEntry .imgs{display:flex; gap:6px; margin-top:6px;}
  .noteEntry .imgs img{width:42px; height:42px; object-fit:cover; border-radius:7px;}
  .noEntries{color:#999; font-size:13px; text-align:center; padding:10px;}

  #closeSheet{
    position:absolute;
    top:7px;
    left:8px;
    margin:0;
    z-index:6;
    background:#fff;
    border:1px solid var(--line);
    border-radius:50%;
    width:34px;
    height:34px;
    font-size:18px;
    font-weight:700;
    color:#444;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }


  @media (max-width:480px){
    #sheet{
      right:8px;
      left:8px;
      bottom:8px;
      max-height:52vh;
    }
    .infoGrid{gap:4px; padding:4px 8px;}
    .infoGrid .cell{padding:3px 5px;}
    #gmapBtn{margin:5px 8px 3px; padding:6px;}
    #sheetBody{padding:5px 8px 7px;}
    #noteText{min-height:40px;}
  }


  #noteCategory{width:100%;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:'Tajawal',sans-serif;font-size:11px;background:#fff;margin-bottom:6px;}
  #noteCategory:focus{outline:none;border-color:var(--amber-500);}
  #reportBtn{background:#fff;border:none;color:var(--teal-950);border-radius:12px;padding:0 10px;font-size:12px;font-family:'Tajawal',sans-serif;white-space:nowrap;font-weight:700;}
  #categoryStatsBtn{background:var(--amber-500);border:none;color:#fff;border-radius:12px;padding:0 10px;font-size:12px;font-family:'Tajawal',sans-serif;white-space:nowrap;}
  #categoryPanel{position:fixed;inset:0;z-index:2000;background:rgba(10,20,20,.55);display:none;align-items:flex-end;justify-content:center;}
  #categoryPanel .panel{background:#fff;width:min(96%,560px);max-height:78vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px;}
  #categoryPanel .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900;color:var(--teal-950);}
  #categoryPanel .close{border:none;background:var(--sand-50);border-radius:50%;width:32px;height:32px;font-size:18px;}
  .catStat{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 6px;font-family:'Tajawal',sans-serif;text-align:right;color:var(--ink);}
  .catStat b{background:var(--teal-900);color:#fff;border-radius:20px;padding:3px 9px;min-width:34px;text-align:center;}
  .catStat.active{background:var(--amber-100);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#ccc; border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="row1">
      <h1>📍 خريطة العدادات الصفرية <span class="count" id="totalCount"></span></h1>
      <input id="empName" placeholder="اسم الموظف" />
    </div>
    <div id="searchRow">
      <input id="searchBox" placeholder="ابحث برقم العداد / رقم الحساب / اسم المشترك / الموقع" />
      <button id="filterBtn">الكل</button>
      <button id="categoryStatsBtn">📊 التصنيفات</button>
       <button id="reportBtn">📥 التقرير المحدث</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <div id="mapWrap" style="position:relative; flex:1 1 auto; min-height:0; height:100%; overflow:hidden;">
    <div id="map"></div>
    <div id="legend">
      <div class="l"><span class="sw" style="background:var(--on-color)"></span> يعمل (ON)</div>
      <div class="l"><span class="sw" style="background:var(--off-color)"></span> متوقف (OFF)</div>
    </div>
    <div id="zoomControls">
      <button id="zoomInBtn" title="تكبير">+</button>
      <button id="zoomOutBtn" title="تصغير">−</button>
    </div>
    <button id="locateBtn" title="تتبّع موقعي">🎯</button>
    <button id="clearTrailBtn" title="مسح المسار">🧹 مسح المسار</button>
  </div>
</div>

<div id="overlay"></div>
<div id="sheet">
  <div id="sheetHandle"><span></span></div>
  <button id="closeSheet">✕</button>
  <div id="sheetHeader">
    <div>
      <h2 id="shName"></h2>
      <div class="meterid" id="shMeter"></div>
    </div>
    <div class="status-badge" id="shStatus"></div>
  </div>

  <div class="infoGrid">
    <div class="cell"><div class="label">رقم الحساب</div><div class="val" id="shAccount"></div></div>
    <div class="cell"><div class="label">الفرع</div><div class="val" id="shBranch"></div></div>
    <div class="cell"><div class="label">الموقع</div><div class="val" id="shPlace"></div></div>
    <div class="cell"><div class="label">المعدل اليومي</div><div class="val" id="shAvg"></div></div>
    <div class="cell"><div class="label">الرصيد الحالي</div><div class="val" id="shBalance"></div></div>
    <div class="cell"><div class="label">آخر دفعة</div><div class="val" id="shLastpay"></div></div>
  </div>

  <a id="gmapBtn" href="#" target="_blank" rel="noopener">🧭 افتح الموقع في خرائط قوقل</a>

  <div id="sheetBody">
    <h3>📋 تصنيف الحالة <span style="color:#c23b3b">*</span></h3>
    <select id="noteCategory" required><option value="">اختر التصنيف إجباريًا...</option><option value="قيد الاستهلاك">قيد الاستهلاك</option><option value="عداد تم اصلاحة">عداد تم اصلاحة</option><option value="غير موصل للعميل">غير موصل للعميل</option><option value="غير موصل بالشبكة">غير موصل بالشبكة</option><option value="تعذر وجود العداد">تعذر وجود العداد</option><option value="لاتوجد امدادات للمياة">لاتوجد امدادات للمياة</option><option value="مباني مهجورة">مباني مهجورة</option><option value="محبس مغلق">محبس مغلق</option><option value="عداد مكسور / لايعمل">عداد مكسور / لايعمل</option><option value="صهاريج">صهاريج</option><option value="اكثر من عداد تابع لنفس المبنى">اكثر من عداد تابع لنفس المبنى</option><option value="موصل للخزان">موصل للخزان</option><option value="مبنى تحت الانشاء">مبنى تحت الانشاء</option><option value="عداد غير مفعل">عداد غير مفعل</option><option value="لايوجد عداد">لايوجد عداد</option><option value="بئر ماء">بئر ماء</option><option value="مقاول مياه">مقاول مياه</option><option value="تغيير فئة العميل">تغيير فئة العميل</option><option value="مشكلة غير ظاهرة">مشكلة غير ظاهرة</option><option value="لم يتم التحقق">لم يتم التحقق</option></select>
    <h3>✏️ الملاحظات الإضافية</h3>
    <textarea id="noteText" placeholder="اكتب ملاحظتك عن هذا العداد..."></textarea>

    <div id="photoRow">
      <label class="photoLabel" for="photoInput">📷 تصوير / إرفاق صورة
        <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none">
      </label>
    </div>
    <div id="photoPreviewWrap"></div>

    <button id="saveBtn">💾 حفظ الملاحظة</button>
    <div id="saveMsg"></div>

    <div id="notesLog">
      <h3>🕐 سجل الملاحظات السابقة</h3>
      <div id="notesLogList"></div>
    </div>
  </div>
</div>


<div id="categoryPanel"><div class="panel"><div class="head"><span>📊 فرز العدادات حسب التصنيف</span><button class="close" id="closeCategoryPanel">✕</button></div><button class="catStat" data-cat="ALL"><span>جميع العدادات</span><b id="count_ALL">0</b></button><div id="categoryStatsList"></div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============ FIREBASE ============ */

/* ============ STORAGE (Firestore + local fallback) ============ */
const EMP_KEY = 'meters_emp_name';
const PENDING_KEY = 'meters_notes_pending'; // notes saved locally while offline, not yet synced

// live in-memory index built from Firestore real-time snapshot: { meterId: [entry, entry, ...] }
let notesIndex = {};
let firestoreReady = false;

function getNotesFor(meterId){
  return notesIndex[meterId] || [];
}

function loadPending(){
  try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }catch(e){ return {}; }
}
function savePendingEntry(meterId, entry){
  const all = loadPending();
  if(!all[meterId]) all[meterId] = [];
  all[meterId].unshift(entry);
  localStorage.setItem(PENDING_KEY, JSON.stringify(all));
}

// merge any locally-pending (offline) notes into the live index so nothing is lost from view
function mergePendingIntoIndex(){
  const pending = loadPending();
  Object.keys(pending).forEach(meterId => {
    if(!notesIndex[meterId]) notesIndex[meterId] = [];
    pending[meterId].forEach(p => notesIndex[meterId].unshift(p));
  });
}

// real-time listener: reflects every employee's notes on every device instantly
notesCollection.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
  const fresh = {};
  snapshot.forEach(doc => {
    const d = doc.data();
    if(!fresh[d.meterId]) fresh[d.meterId] = [];
    fresh[d.meterId].push({
      employee: d.employee,
      category: d.category || '',
      text: d.text,
      photos: d.photos || [],
      time: d.time
    });
  });
  notesIndex = fresh;
  mergePendingIntoIndex();
  firestoreReady = true;
  // if a meter's sheet is currently open, refresh its log live
  if(currentMeter) renderNotesLog(currentMeter.meter);
  if(document.getElementById('categoryPanel').style.display === 'flex') renderCategoryStats();
  refreshVisitedMarkers();
}, err => {
  console.error('Firestore listener error:', err);
  mergePendingIntoIndex();
});

async function addNoteFor(meterId, entry){
  try{
    await notesCollection.add({
      meterId: meterId,
      employee: entry.employee,
      category: entry.category || '',
      text: entry.text,
      photos: entry.photos,
      time: entry.time,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true; // synced successfully, everyone will see it live
  }catch(e){
    console.error('Failed to sync note, saving locally:', e);
    savePendingEntry(meterId, entry);
    if(!notesIndex[meterId]) notesIndex[meterId] = [];
    notesIndex[meterId].unshift(entry);
    return false; // saved locally only, will not show for other employees
  }
}

const empInput = document.getElementById('empName');
empInput.value = localStorage.getItem(EMP_KEY) || '';
empInput.addEventListener('input', () => localStorage.setItem(EMP_KEY, empInput.value.trim()));

/* ============ MAP ============ */
const map = L.map('map', {
  zoomControl:false,
  attributionControl:true,
  dragging:true,
  touchZoom:true,
  scrollWheelZoom:true,
  doubleClickZoom:true,
  boxZoom:true,
  tap:true,
  inertia:true
}).setView([26.15,40.6], 10);

// Two base layers the user can switch between manually (like a normal map app):
// standard OpenStreetMap (most reliable / loads fully) and Esri satellite imagery
// (richer detail, but some tiles can come back blank on certain networks).
const standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap'
});
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19,
  attribution:'Tiles &copy; Esri'
});
const satelliteLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19,
  attribution:'',
  opacity:0.9
});

standardLayer.addTo(map);
let isSatelliteView = false;

const mapTypeBtn = document.createElement('button');
mapTypeBtn.textContent = '🛰️ قمر صناعي';
mapTypeBtn.style.cssText = 'position:absolute; top:8px; left:8px; z-index:900; background:#fff; border:none; border-radius:10px; padding:8px 12px; font-family:Tajawal,sans-serif; font-size:13px; font-weight:700; color:#0f3d3d; box-shadow:0 2px 8px rgba(0,0,0,.25);';
document.querySelector('#map').parentElement.appendChild(mapTypeBtn);

mapTypeBtn.addEventListener('click', () => {
  isSatelliteView = !isSatelliteView;
  if(isSatelliteView){
    map.removeLayer(standardLayer);
    satelliteLayer.addTo(map);
    satelliteLabels.addTo(map);
    mapTypeBtn.textContent = '🗺️ عادي';
    setTimeout(() => {
      map.invalidateSize({ pan:false });
      satelliteLayer.redraw();
      satelliteLabels.redraw();
    }, 80);
  } else {
    map.removeLayer(satelliteLayer);
    map.removeLayer(satelliteLabels);
    standardLayer.addTo(map);
    mapTypeBtn.textContent = '🛰️ قمر صناعي';
    setTimeout(() => {
      map.invalidateSize({ pan:false });
      standardLayer.redraw();
    }, 80);
  }
});

// كل عداد يظهر كدبوس مستقل بدون أي تجميع أو فقاعات أرقام.
const meterLayer = L.layerGroup().addTo(map);

function pinIcon(status, visited=false){
  const cls = status === 'ON' ? 'on' : 'off';
  const check = visited ? '<span class="visited-check">✓</span>' : '';
  return L.divIcon({
    className:'',
    html:`<div class="meter-pin ${cls}"><div class="dot"></div>${check}</div>`,
    iconSize:[26,26],
    iconAnchor:[13,26],
    popupAnchor:[0,-24]
  });
}

const markersByMeter = {};
const bounds = [];

METERS.forEach(m => {
  const marker = L.marker([m.lat, m.lng], { icon: pinIcon(m.status, !!(notesIndex[m.meter] && notesIndex[m.meter].length)) });
  marker.meterData = m;
  marker.on('click', () => openSheet(m));
  meterLayer.addLayer(marker);
  markersByMeter[m.meter] = marker;
  bounds.push([m.lat, m.lng]);
});
if(bounds.length) map.fitBounds(bounds, { padding:[30,30] });

// علامة ✓ صغيرة على كل عداد تمت زيارته (له تسجيل محفوظ في Firebase).
function refreshVisitedMarkers(){
  Object.keys(markersByMeter).forEach(meterId => {
    const marker = markersByMeter[meterId];
    const m = marker.meterData;
    const visited = !!(notesIndex[meterId] && notesIndex[meterId].length);
    marker.setIcon(pinIcon(m.status, visited));
  });
}

/* Fix for blank/white map on mobile: Leaflet sometimes measures its container
   before the page has finished laying out (especially inside flex containers
   or right after the page loads on a phone). Forcing a resize check a moment
   after load, and again on orientation/resize changes, makes the tiles and
   drag/pan behavior render correctly. */
function refreshMapSize(refit=false){
  map.invalidateSize({ pan:false, debounceMoveend:true });
  if(refit && bounds.length) map.fitBounds(bounds, { padding:[30,30], maxZoom:15 });
}
window.addEventListener('load', () => setTimeout(() => refreshMapSize(true), 250));
setTimeout(() => refreshMapSize(true), 700);
setTimeout(() => refreshMapSize(false), 1500);
setTimeout(() => refreshMapSize(false), 3000);
window.addEventListener('resize', () => setTimeout(() => refreshMapSize(false), 100));
window.addEventListener('orientationchange', () => setTimeout(() => refreshMapSize(false), 400));
window.addEventListener('pageshow', () => setTimeout(() => refreshMapSize(false), 250));

// Most robust fix: watch the map container itself and re-check its size the instant
// it actually changes, instead of guessing fixed delays. This catches slow CDN loads,
// slow layout on older phones, or the address bar hiding/showing on mobile Safari.
if(window.ResizeObserver){
  const mapContainerEl = document.getElementById('map');
  const mapWrapEl = document.getElementById('mapWrap');
  const ro = new ResizeObserver(() => {
    requestAnimationFrame(() => map.invalidateSize({ pan:false }));
  });
  ro.observe(mapContainerEl);
  if(mapWrapEl) ro.observe(mapWrapEl);
}

/* category statistics + map filtering */

function latestCategoryForMeter(meterId){

function categoryCounts(){

/* ============ LIVE LOCATION TRACKING (continuous, with walked-path trail) ============ */
let watchId = null;
let liveMarker = null;
let trailPoints = [];
let trailLine = null;
let followMe = true;
const TRAIL_KEY = 'meters_walk_trail';

function loadSavedTrail(){
  try{
    const saved = JSON.parse(localStorage.getItem(TRAIL_KEY) || '[]');
    if(Array.isArray(saved) && saved.length){
      trailPoints = saved;
      trailLine = L.polyline(trailPoints, { color:'#1d6fd9', weight:4, opacity:.75 }).addTo(map);
      document.getElementById('clearTrailBtn').classList.add('show');
    }
  }catch(e){}
}
loadSavedTrail();

function liveIcon(){
  return L.divIcon({
    className:'',
    html:'<div class="live-dot-wrap"><div class="live-dot-pulse"></div><div class="live-dot-core"></div></div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function onPosition(pos){
  const latlng = [pos.coords.latitude, pos.coords.longitude];
  if(!liveMarker){
    liveMarker = L.marker(latlng, { icon: liveIcon(), zIndexOffset: 1000 }).addTo(map);
  } else {
    liveMarker.setLatLng(latlng);
  }
  // accumulate the walked path
  const last = trailPoints[trailPoints.length-1];
  if(!last || map.distance(last, latlng) > 3){ // avoid noisy jitter, only add when moved >3m
    trailPoints.push(latlng);
    if(!trailLine){
      trailLine = L.polyline(trailPoints, { color:'#1d6fd9', weight:4, opacity:.75 }).addTo(map);
    } else {
      trailLine.setLatLngs(trailPoints);
    }
    localStorage.setItem(TRAIL_KEY, JSON.stringify(trailPoints));
    document.getElementById('clearTrailBtn').classList.add('show');
  }
  if(followMe) map.setView(latlng, Math.max(map.getZoom(), 16));
}

function onPositionError(err){
  alert('تعذر تحديد موقعك، تأكد من تفعيل خدمة الموقع. (' + (err.message || '') + ')');
  stopTracking();
}

function startTracking(){
  if(!navigator.geolocation){ alert('المتصفح لا يدعم تحديد الموقع'); return; }
  followMe = true;
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy:true, maximumAge:2000, timeout:15000
  });
  document.getElementById('locateBtn').classList.add('tracking');
}

function stopTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locateBtn').classList.remove('tracking');
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if(watchId === null) startTracking(); else stopTracking();
});

// if the user manually drags/zooms the map while tracking, stop auto-recentering
// until they tap the locate button again, so they can freely browse the map
map.on('dragstart', () => { if(watchId !== null) followMe = false; });

document.getElementById('clearTrailBtn').addEventListener('click', () => {
  trailPoints = [];
  localStorage.removeItem(TRAIL_KEY);
  if(trailLine){ map.removeLayer(trailLine); trailLine = null; }
  document.getElementById('clearTrailBtn').classList.remove('show');
});

/* photo handling — resize + compress before storing so Firestore docs stay small and fast to sync */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('photoInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for(const file of files){
    try{
      const compressed = await compressImage(file, 900, 0.6);
      pendingPhotos.push(compressed);
      renderPendingPhotos();
    }catch(err){
      console.error('photo compress failed', err);
    }
  }
  e.target.value = '';
});

function renderPendingPhotos(){
  const wrap = document.getElementById('photoPreviewWrap');
  wrap.innerHTML = '';
  pendingPhotos.forEach((src, idx) => {
    const box = document.createElement('div');
    box.className = 'photoDel';
    box.innerHTML = `<img src="${src}"><div class="x" data-idx="${idx}">✕</div>`;
    box.querySelector('.x').addEventListener('click', () => {
      pendingPhotos.splice(idx, 1);
      renderPendingPhotos();
    });
    wrap.appendChild(box);
  });
}


/* ============ LIVE EXCEL REPORT ============ */
function downloadUpdatedReport(){
  try{
    if(typeof XLSX === 'undefined'){
      alert('تعذر تحميل أداة إنشاء Excel. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.');
      return;
    }
    const extraHeaders = ['تصنيف الحالة','الملاحظة','اسم الموظف','تاريخ ووقت آخر تحديث'];
    const aoa = [ZERO_REPORT_HEADERS.concat(extraHeaders)];
    ZERO_REPORT_DATA.forEach(row => {
      const meterId = String(row[3] || '').trim();
      const arr = getNotesFor(meterId);
      const latest = arr && arr.length ? arr[0] : null;
      aoa.push(row.concat([
        latest ? (latest.category || '') : '',
        latest ? (latest.text || '') : '',
        latest ? (latest.employee || '') : '',
        latest ? (latest.time || '') : ''
      ]));
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [
      {wch:15},{wch:30},{wch:14},{wch:16},{wch:13},{wch:14},{wch:16},{wch:16},{wch:16},
      {wch:16},{wch:18},{wch:16},{wch:16},{wch:20},{wch:24},{wch:38},{wch:20},{wch:24}
    ];
    ws['!autofilter'] = {ref:'A1:R'+aoa.length};
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تقرير العدادات الصفرية');
    const d = new Date();
    const pad=n=>String(n).padStart(2,'0');
    const name = `تقرير_العدادات_الصفرية_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.xlsx`;
    XLSX.writeFile(wb, name);
  }catch(e){
    console.error(e);
    alert('تعذر إنشاء التقرير: '+e.message);
  }
}
document.getElementById('reportBtn').addEventListener('click', downloadUpdatedReport);
